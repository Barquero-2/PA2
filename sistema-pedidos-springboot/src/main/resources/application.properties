server.port=8081
server.servlet.context-path=/sistema-pedidos
spring.application.name=sistema-pedidos-springboot
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
inventario.api.base-url=http://localhost:8082/inventario-service/api
inventario.api.connect-timeout-ms=1500
inventario.api.read-timeout-ms=3000
